load_module /usr/lib/nginx/modules/ngx_stream_module.so;

user root;
worker_processes auto;
worker_rlimit_nofile 100000;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events {
      worker_connections  10240;
      use epoll;
      multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    include /etc/nginx/conf.d/*.conf;
    
    #启用访问日志，其默认配置如下：（选配）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main; #访问日志的文件地址。（选配）

    sendfile on;
    server_tokens       off;
    server_names_hash_bucket_size 128;

    keepalive_timeout  120s 120s;
    keepalive_requests 10000;

    server {
        listen 80;
        return 301 https://$host$request_uri; #HTTP 自动跳转 HTTPS，让网站看起来更真实。
    }

    server {
        listen 127.0.0.1:82 proxy_protocol; #仅版本不小于 v1.25.1 配置，否则必须删除。
        http2 on;

        location / {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; #启用 HSTS
            root /etc/nginx/html;
            index index.html index.htm;
        }
    }

}


stream {
    log_format proxy '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr" '
                     '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';
    access_log /var/log/nginx/tcp-access.log proxy ;

    map_hash_max_size 262144;
    map_hash_bucket_size 128;


    map $ssl_preread_server_name $name {
        hostnames;  ## 通配符需要加这个
        ~^.+f1-.+\.the-best-chinaos\.com$     127.0.0.1:38443;
        ~^.+f2-.+\.the-best-chinaos\.com$     unix:/dev/shm/nginx_ws.sock;
        ~^.+f3-.+\.the-best-chinaos\.com$     unix:/dev/shm/nginx_grpc.sock;
        default                                127.0.0.1:82;
    }
   
    server {
        listen      443 ;
        proxy_pass  $name;
        ssl_preread on;
        proxy_protocol on;
    }

}
